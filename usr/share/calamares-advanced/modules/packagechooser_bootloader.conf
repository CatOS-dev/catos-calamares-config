# SPDX-License-Identifier: CC0-1.0
---
mode: required
method: legacy
labels:
  step: "Boot method"
  step[zh_CN]: "引导方式"
default: grub
items:
  - id: grub
    name: "GRUB"
    description: "The compatibility-oriented choice for UEFI and legacy BIOS systems, with bootable Btrfs snapshots."
    description[zh_CN]: "兼容性优先的选择，支持 UEFI、传统 BIOS 和可启动 Btrfs 快照。"
    screenshot: "/usr/share/calamares-advanced/images/bootloaders/grub.png"
  - id: limine
    name: "Limine"
    visibleWhen:
      - "firmwareType == 'efi'"
    description: "A modern UEFI bootloader managed by limine-tool, with native CatOS Btrfs snapshot integration."
    description[zh_CN]: "由 limine-tool 管理的现代 UEFI 引导加载器，原生集成 CatOS Btrfs 快照。"
    screenshot: "/usr/share/calamares-advanced/images/bootloaders/limine.png"
  - id: refind
    name: "rEFInd"
    visibleWhen:
      - "firmwareType == 'efi'"
      - "secureboot.enabled != true"
    description: "A graphical UEFI boot manager that automatically discovers installed operating systems and Linux kernels."
    description[zh_CN]: "图形化 UEFI 引导管理器，可自动发现已安装的操作系统和 Linux 内核。"
    screenshot: "/usr/share/calamares-advanced/images/bootloaders/refind.png"
  - id: systemd-boot
    name: "systemd-boot"
    visibleWhen:
      - "firmwareType == 'efi'"
    description: "A compact UEFI boot manager using kernel-install, with sdboot-btrfs snapshot entries."
    description[zh_CN]: "使用 kernel-install 的精简 UEFI 引导管理器，并支持 sdboot-btrfs 快照条目。"
    screenshot: "/usr/share/calamares-advanced/images/bootloaders/systemd-boot.png"
  - id: uki
    name: "Unified Kernel Image"
    visibleWhen:
      - "firmwareType == 'efi'"
    description: "Build unified kernel images and boot them directly, using shim automatically when Secure Boot is active."
    description[zh_CN]: "构建统一内核镜像并直接启动；启用安全启动时自动通过 shim 验证。"
    screenshot: "/usr/share/calamares-advanced/images/bootloaders/uki.png"
  - id: efistub
    name: "Linux EFI Stub"
    visibleWhen:
      - "firmwareType == 'efi'"
      - "secureboot.enabled != true"
    description: "Deploy the Linux EFI stub and initramfs to the ESP and register firmware boot entries directly."
    description[zh_CN]: "将 Linux EFI Stub 与 initramfs 部署到 ESP，并直接注册固件启动项。"
    screenshot: "/usr/share/calamares-advanced/images/bootloaders/efistub.png"

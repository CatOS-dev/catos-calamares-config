# SPDX-License-Identifier: CC0-1.0
#
### pacstrap Module
#
# This module installs the base system and then copies files
# into the installation that will be used in the installed system
#

---
# basePackages is an array of package names to pass to pacstrap
#
basePackages:
  - base
  - base-devel
  - linux-firmware
  - btrfs-progs
  - networkmanager
  - vim
  - sudo
  - efibootmgr
  - intel-ucode
  - amd-ucode
  - sof-firmware
  - lvm2
  - mkinitcpio-openswap
  - man-db
  - man-pages
  - plymouth
  - lsb-release
  - f2fs-tools 
  - e2fsprogs 
  - xfsprogs 
  - jfsutils
  - fish
  - catos-plymouth-theme
  - catos-branding
  - chwd

# Packages required by mandatory jobs later in the Calamares sequence.
requiredPackages:
  - chwd
  - fish
  - mkinitcpio-openswap

#
# postInstallFiles is an array of file names which will be copied into the system
#
# The paths should be relative to the host and the files will be copied to the
# location in the installed system
#
postInstallFiles:
  # Desktop selection and appearance are best-effort. Their absence must not
  # turn an otherwise bootable system installation into a failed installation.
  - "/etc/calamares/scripts/configure-display-manager"
  - "/etc/calamares/scripts/configure-selected-desktop"
  - "/etc/calamares/scripts/activate-catdot-profile"
  - "/etc/calamares/scripts/customize_airootfs.sh"
  - "/etc/calamares/scripts/customize_before.sh"

# Missing or unreadable files in these lists indicate an installer packaging
# defect, not an optional customization failure. The pacstrap module verifies
# and copies them before later jobs enter the target environment.
requiredPostInstallFiles:
  - "/etc/pacman.conf"

requiredPostInstallExecutables:
  - "/etc/calamares/scripts/shell-setup"
  - "/etc/calamares/scripts/bootstrap-cachyos"
  - "/etc/calamares/scripts/adjust_grub_theme_after.sh"

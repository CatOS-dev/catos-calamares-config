#
# Configuration for the low-density desktop chooser
---
mode: required
method: netinstall-select

labels:
    step: "Desktop"
    step[de]: "Desktop"
    step[fi]: "Työpöytä"
    step[fr]: "Bureau"
    step[it]: "Desktop"
    step[es]: "Escritorio"
    step[ru]: "Рабочий стол"
    step[zh_CN]: "桌面"
    step[ja]: "デスクトップ"
    step[sv]: "Skrivbord"
    step[pt_BR]: "Ambiente de Trabalho"

default: KDE-Desktop

items:
    - id: ""
      name: "No Desktop"
      name[de]: "Kein Desktop"
      name[nl]: "Geen desktop"
      description: "Install a command-line system without a graphical desktop."
      description[zh_CN]: "安装不带图形桌面的命令行系统。"
      screenshot: "/usr/share/calamares-advanced/images/no_desktop.png"

    - id: KDE-Desktop
      name: "Plasma Desktop"
      description: "A powerful and highly customizable Qt desktop."
      description[zh_CN]: "功能完整、可高度定制的 Qt 桌面。"
      screenshot: "/usr/share/calamares-advanced/images/kde.png"

    - id: GNOME-Desktop
      name: "GNOME"
      description: "A focused and polished desktop with an integrated workflow."
      description[zh_CN]: "注重一致性与工作流整合的现代桌面。"
      screenshot: "/usr/share/calamares-advanced/images/gnome.png"


    - id: Niri-dms
      name: "Niri + DMS"
      description: "A scrolling tiling Wayland desktop with Dank Material Shell."
      description[zh_CN]: "使用 Dank Material Shell 的滚动平铺式 Wayland 桌面。"
      screenshot: "/usr/share/calamares-advanced/images/niri_dms.png"

    - id: Niri-noctalia
      name: "Niri + Noctalia"
      description: "A scrolling tiling Wayland desktop with Noctalia Shell."
      description[zh_CN]: "使用 Noctalia Shell 的滚动平铺式 Wayland 桌面。"
      screenshot: "/usr/share/calamares-advanced/images/niri_noctalia.png"

    - id: Hyprland-dms
      name: "Hyprland + DMS"
      description: "A dynamic tiling Wayland desktop with Dank Material Shell."
      description[zh_CN]: "使用 Dank Material Shell 的动态平铺式 Wayland 桌面。"
      screenshot: "/usr/share/calamares-advanced/images/niri_dms.png"

    - id: Deepin-Desktop
      name: "Deepin Desktop"
      description: "A polished desktop with an integrated Deepin workflow."
      description[zh_CN]: "界面精致、组件高度整合的深度桌面环境。"
      screenshot: "/usr/share/calamares-advanced/images/deepin.png"

    - id: Xfce4
      name: "Xfce"
      description: "A lightweight traditional desktop with low resource usage."
      description[zh_CN]: "资源占用较低的轻量传统桌面。"
      screenshot: "/usr/share/calamares-advanced/images/xfce.png"

    - id: Cinnamon
      name: "Cinnamon"
      description: "A familiar traditional desktop built with GTK."
      description[zh_CN]: "使用 GTK 构建、操作习惯传统的桌面。"
      screenshot: "/usr/share/calamares-advanced/images/cinnamon.png"

    - id: Cosmic
      name: "COSMIC"
      description: "A modern Wayland desktop written primarily in Rust."
      description[zh_CN]: "主要使用 Rust 开发的现代 Wayland 桌面。"
      screenshot: "/usr/share/calamares-advanced/images/cosmic.png"

    - id: Budgie-Desktop
      name: "Budgie"
      description: "A clean and familiar desktop built around GTK technologies."
      description[zh_CN]: "基于 GTK 技术、简洁且易上手的桌面。"
      screenshot: "/usr/share/calamares-advanced/images/budgie.png"

    - id: LXDE-Desktop
      name: "LXDE"
      description: "A minimal X11 desktop for low-resource systems."
      description[zh_CN]: "适用于低配置设备的精简 X11 桌面。"
      screenshot: "/usr/share/calamares-advanced/images/lxde.png"

    - id: LXQT-Desktop
      name: "LXQt"
      description: "A lightweight Qt desktop with a classic layout."
      description[zh_CN]: "使用 Qt、布局经典的轻量桌面。"
      screenshot: "/usr/share/calamares-advanced/images/lxqt.png"

    - id: MATE-Desktop
      name: "MATE"
      description: "A traditional desktop continuing the GNOME 2 experience."
      description[zh_CN]: "延续 GNOME 2 使用方式的传统桌面。"
      screenshot: "/usr/share/calamares-advanced/images/mate.png"

    - id: Sway
      name: "Sway"
      description: "A stable, keyboard-driven tiling Wayland environment."
      description[zh_CN]: "稳定、键盘驱动的平铺式 Wayland 环境。"
      screenshot: "/usr/share/calamares-advanced/images/sway.png"

    - id: Labwc
      name: "Labwc"
      description: "A lightweight floating Wayland desktop inspired by Openbox."
      description[zh_CN]: "受 Openbox 启发的轻量 Wayland 浮动桌面。"
      screenshot: "/usr/share/calamares-advanced/images/labwc.png"

    - id: Wayfire
      name: "Wayfire"
      description: "A lightweight floating Wayland desktop with tasteful effects."
      description[zh_CN]: "带有适度桌面特效的轻量 Wayland 浮动环境。"
      screenshot: "/usr/share/calamares-advanced/images/wayfire.png"

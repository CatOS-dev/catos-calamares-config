---
packageCheck:
  rules:
    - when: 'package("docker") && package("podman-docker")'
      level: error
      message: "Docker and Podman's Docker compatibility component cannot be installed together. Please adjust your selection."
      message[zh_CN]: "Docker 与 Podman 的 Docker 兼容组件不能同时安装，请修改选择。"
    - when: 'package("chromium") && package("ungoogled-chromium-bin")'
      level: error
      message: "Chromium and Ungoogled Chromium cannot be installed together. Please choose one."
      message[zh_CN]: "Chromium 与 Ungoogled Chromium 不能同时安装，请选择其中一个。"
    - when: '(package("fcitx5") || package("fcitx5-im")) && package("ibus")'
      level: warning
      message: "Two input method frameworks are selected. You may need to set the default after installation."
      message[zh_CN]: "选择了两套输入法，安装后可能需要设置默认输入法。"

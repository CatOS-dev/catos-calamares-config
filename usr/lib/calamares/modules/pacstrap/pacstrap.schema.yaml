---
$schema: https://json-schema.org/schema#
$id: https://calamares.io/schemas/catos-pacstrap
additionalProperties: false
type: object
properties:
    basePackages: { type: array }
    requiredPackages: { type: array, default: [] }
    postInstallFiles: { type: array }
    requiredPostInstallFiles: { type: array, default: [] }
    requiredPostInstallExecutables: { type: array, default: [] }
    sync_db: { type: boolean, default: true }
required: [ basePackages ]